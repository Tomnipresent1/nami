<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#efe4c6">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>NAMI</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #efe4c6; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; width: 100vw; height: 100vh; }
  .tbtn { position: fixed; top: 10px; z-index: 5; width: 36px; height: 36px; border: 1px solid rgba(22,33,59,.35); border-radius: 8px; background: rgba(239,228,198,.6); color: #16213b; font: 15px/1 Georgia, serif; padding: 0; }
  #fs { right: 8px; } #pausebtn { right: 52px; display: none; }
  body.playing #pausebtn { display: block; }
  body.paused #pausebtn { visibility: hidden; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 9; background: #efe4c6; color: #16213b; text-align: center; font: bold 20px/1.5 Georgia, serif; align-items: center; justify-content: center; flex-direction: column; }
  #rotate .ico { font-size: 64px; display: inline-block; animation: tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 70%, 100% { transform: rotate(-90deg); } }
  #rotate.up .ico { animation-direction: reverse; }
  body.wrongway #rotate { display: flex; }
</style>
</head>
<body>
<div id="rotate"><div class="ico">📱</div><div id="rotatemsg">TURN YOUR PHONE SIDEWAYS<br>to sail NAMI</div></div>
<canvas id="screen"></canvas>
<button id="fs" class="tbtn" aria-label="Fullscreen">⛶</button>
<button id="pausebtn" class="tbtn" aria-label="Pause">❚❚</button>
<script type="module" src="src/main.js"></script>
<script>
  // If anything goes wrong while the game starts, say so on screen instead of showing a blank page.
  window.addEventListener('error', function (e) {
    var d = document.getElementById('errbox');
    if (!d) { d = document.createElement('div'); d.id = 'errbox'; d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#300;color:#fff;font:12px/1.4 monospace;padding:8px;border-radius:6px;white-space:pre-wrap'; document.body && document.body.appendChild(d); }
    if (d) d.textContent += 'Something went wrong: ' + (e.message || e) + '\n';
  });
</script>
</body>
</html>
